<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snake Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <main class="game-shell">
      <section class="scorebar" aria-label="Game status">
        <div>
          <span class="label">Score</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span class="label">Best</span>
          <strong id="best">0</strong>
        </div>
        <button id="restart" type="button">Restart</button>
      </section>

      <canvas id="board" width="480" height="480" aria-label="Snake game board"></canvas>

      <section class="touch-controls" aria-label="Touch controls">
        <button type="button" data-dir="up" aria-label="Move up">▲</button>
        <div>
          <button type="button" data-dir="left" aria-label="Move left">◀</button>
          <button type="button" data-dir="down" aria-label="Move down">▼</button>
          <button type="button" data-dir="right" aria-label="Move right">▶</button>
        </div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/snake.js') }}"></script>
  </body>
</html>
